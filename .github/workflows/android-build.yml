name: Android build

on:
  push:
    branches: [main, android-mvp]
    paths: ["android-app/**", ".github/workflows/android-build.yml"]
  pull_request:
    paths: ["android-app/**", ".github/workflows/android-build.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - run: gradle assembleDebug
      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ../KC-VPN-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: KC-VPN-Android
          path: KC-VPN-Android.apk
      - name: Publish permanent Android download
        if: github.event_name == 'push' && github.ref == 'refs/heads/android-mvp'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-latest >/dev/null 2>&1; then
            gh release upload android-latest KC-VPN-Android.apk --clobber
          else
            gh release create android-latest KC-VPN-Android.apk \
              --target "${GITHUB_SHA}" \
              --title "K&C VPN Android" \
              --notes "Актуальная тестовая сборка K&C VPN для Android."
          fi
